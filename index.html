<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym QR">
<title>Gym QR - Club Atlético San Miguel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f0f 0%, #000 100%);
  color: #fff;
  min-height: 100vh;
  overflow: hidden;
}

/* Container for all screens */
.screen {
  min-height: 100vh;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.screen.active {
  display: flex;
}

/* ========== Setup Screen ========== */
#setup-screen h1 {
  font-size: 36px;
  margin-bottom: 8px;
  font-weight: 700;
  text-align: center;
}

#setup-screen .subtitle {
  color: #888;
  margin-bottom: 50px;
  font-size: 15px;
  text-align: center;
}

.input-group {
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
  text-align: left;
}

.input-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #aaa;
  font-weight: 500;
}

.input-group input {
  width: 100%;
  padding: 16px;
  border: 2px solid #333;
  border-radius: 12px;
  background: #1a1a1a;
  color: #fff;
  font-size: 17px;
  transition: all 0.2s;
}

.input-group input:focus {
  outline: none;
  border-color: #34c759;
  background: #222;
}

/* ========== Main Screen ========== */
#main-screen {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.app-header {
  margin-bottom: 60px;
}

.app-header h1 {
  font-size: 42px;
  margin-bottom: 8px;
  font-weight: 800;
}

.app-header .tagline {
  color: #888;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* User Card */
.user-card {
  background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
  border: 1px solid #333;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 30px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.user-card .label {
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.user-card .value {
  color: #34c759;
  font-size: 28px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  margin-bottom: 16px;
}

.user-card .status {
  color: #666;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.user-card .status .dot {
  width: 8px;
  height: 8px;
  background: #34c759;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Buttons */
.btn-main {
  width: 100%;
  max-width: 400px;
  padding: 20px;
  background: linear-gradient(135deg, #34c759 0%, #2fb350 100%);
  color: #fff;
  border: none;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(52, 199, 89, 0.3);
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.btn-main:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2);
}

.btn-secondary {
  width: 100%;
  max-width: 400px;
  padding: 14px;
  background: #1a1a1a;
  color: #888;
  border: 1px solid #333;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 12px;
  transition: all 0.2s;
}

.btn-secondary:active {
  background: #222;
  border-color: #444;
}

/* ========== QR Screen ========== */
#qr-screen {
  padding: 0;
  background: #000;
}

.qr-container {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.qr-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.qr-header .btn-back {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.qr-header .btn-back:active {
  background: rgba(255,255,255,0.3);
}

.qr-header .status-indicator {
  background: rgba(52, 199, 89, 0.2);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(52, 199, 89, 0.4);
  color: #34c759;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.qr-header .status-indicator .pulse-dot {
  width: 6px;
  height: 6px;
  background: #34c759;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

#club-iframe {
  width: 100%;
  flex: 1;
  border: none;
  background: #000;
}

/* Loading State */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 1000;
}

.loading-overlay.active {
  display: flex;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid #333;
  border-top: 4px solid #34c759;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  color: #888;
  font-size: 14px;
}

/* Info Box */
.info-box {
  width: 100%;
  max-width: 400px;
  background: rgba(0, 122, 255, 0.1);
  border: 1px solid rgba(0, 122, 255, 0.3);
  border-radius: 12px;
  padding: 16px;
  margin-top: 30px;
  text-align: left;
}

.info-box .title {
  color: #007aff;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}

.info-box .content {
  color: #888;
  font-size: 13px;
  line-height: 1.5;
}

/* Status Messages */
.status-message {
  width: 100%;
  max-width: 400px;
  margin-top: 20px;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.status-error {
  background: rgba(255, 59, 48, 0.15);
  border: 1px solid rgba(255, 59, 48, 0.3);
  color: #ff3b30;
}

.status-success {
  background: rgba(52, 199, 89, 0.15);
  border: 1px solid rgba(52, 199, 89, 0.3);
  color: #34c759;
}

.footer {
  margin-top: 40px;
  color: #444;
  font-size: 12px;
  text-align: center;
}
</style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Conectando al club...</div>
</div>

<!-- Setup Screen (Primera vez) -->
<div id="setup-screen" class="screen">
  <h1>🏋️ Gym QR</h1>
  <p class="subtitle">Acceso rápido al club</p>

  <div class="input-group">
    <label>Número de Socio</label>
    <input type="number" id="setup-usuario" placeholder="Ej: 12345678" inputmode="numeric" autocomplete="off">
  </div>

  <div class="input-group">
    <label>Contraseña</label>
    <input type="password" id="setup-clave" placeholder="Tu contraseña del club" autocomplete="off">
  </div>

  <button class="btn-main" onclick="saveCredentials()">Guardar Credenciales</button>

  <div id="setup-status"></div>

  <div class="info-box">
    <div class="title">🔒 Seguridad</div>
    <div class="content">
      Tus credenciales se guardan solo en este dispositivo. Nunca se envían a servidores externos.
    </div>
  </div>
</div>

<!-- Main Screen (Pantalla principal) -->
<div id="main-screen" class="screen">
  <div class="app-header">
    <h1>🏋️</h1>
    <p class="tagline">Club Atlético</p>
  </div>

  <div class="user-card">
    <div class="label">Socio Nº</div>
    <div class="value" id="display-usuario"></div>
    <div class="status">
      <span class="dot"></span>
      Credenciales guardadas
    </div>
  </div>

  <button class="btn-main" onclick="enterClub()">
    🚀 Entrar al Club
  </button>

  <button class="btn-secondary" onclick="showChangeCredentials()">
    Cambiar Credenciales
  </button>

  <div class="footer">
    Club Atlético San Miguel
  </div>
</div>

<!-- QR Screen (Muestra el panel del club) -->
<div id="qr-screen" class="screen">
  <div class="qr-container">
    <div class="qr-header">
      <button class="btn-back" onclick="goBack()">← Volver</button>
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        Sesión activa
      </div>
    </div>
    <iframe id="club-iframe" src="about:blank"></iframe>
  </div>
</div>

<!-- Hidden login form -->
<form id="login-form" action="https://socios.clubatleticosanmiguel.com/" method="POST" target="club-iframe" style="display:none">
  <input type="number" name="usuario" id="form-usuario">
  <input type="password" name="clave" id="form-clave">
</form>

<script>
let credentials = null;
let currentScreen = null;

// Check for saved credentials on load
window.onload = function() {
  const saved = localStorage.getItem('gym-credentials');
  if (saved) {
    credentials = JSON.parse(saved);
    showScreen('main');
  } else {
    showScreen('setup');
  }
};

function showScreen(screenName) {
  // Hide all screens
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

  // Show selected screen
  const screen = document.getElementById(screenName + '-screen');
  if (screen) {
    screen.classList.add('active');
    currentScreen = screenName;
  }

  // Update display if on main screen
  if (screenName === 'main' && credentials) {
    document.getElementById('display-usuario').textContent = credentials.usuario;
  }
}

function saveCredentials() {
  const usuario = document.getElementById('setup-usuario').value.trim();
  const clave = document.getElementById('setup-clave').value.trim();

  if (!usuario || !clave) {
    showStatus('setup', 'Por favor completa ambos campos', 'error');
    return;
  }

  if (isNaN(usuario)) {
    showStatus('setup', 'El número de socio debe ser numérico', 'error');
    return;
  }

  credentials = { usuario, clave };
  localStorage.setItem('gym-credentials', JSON.stringify(credentials));

  showStatus('setup', '✓ Credenciales guardadas correctamente', 'success');

  setTimeout(() => {
    showScreen('main');
  }, 1000);
}

function enterClub() {
  // Show QR screen first
  showScreen('qr');

  // Show loading
  document.getElementById('loading').classList.add('active');

  // Fill form
  document.getElementById('form-usuario').value = credentials.usuario;
  document.getElementById('form-clave').value = credentials.clave;

  // Submit form - iframe will receive the login response
  document.getElementById('login-form').submit();

  // Hide loading after delay (iframe will load in background)
  setTimeout(() => {
    document.getElementById('loading').classList.remove('active');
  }, 2000);
}

function goBack() {
  // Clear iframe to save resources
  document.getElementById('club-iframe').src = 'about:blank';
  showScreen('main');
}

function showChangeCredentials() {
  if (confirm('¿Quieres cambiar tus credenciales guardadas?')) {
    document.getElementById('setup-usuario').value = '';
    document.getElementById('setup-clave').value = '';
    showScreen('setup');
  }
}

function showStatus(screen, message, type) {
  const statusId = screen === 'setup' ? 'setup-status' : 'main-status';
  let statusEl = document.getElementById(statusId);

  if (!statusEl) {
    statusEl = document.createElement('div');
    statusEl.id = statusId;
    const screenEl = document.getElementById(screen + '-screen');
    screenEl.appendChild(statusEl);
  }

  statusEl.className = `status-message status-${type}`;
  statusEl.textContent = message;
  statusEl.style.display = 'block';
}

// Handle iOS Safari back button
window.addEventListener('pageshow', function(event) {
  if (event.persisted || (performance.getEntriesByType("navigation")[0] && performance.getEntriesByType("navigation")[0].type === 'back_forward')) {
    const saved = localStorage.getItem('gym-credentials');
    if (saved) {
      credentials = JSON.parse(saved);
      if (currentScreen === 'qr') {
        // Refresh panel if coming back
        document.getElementById('club-iframe').src = 'https://socios.clubatleticosanmiguel.com/panel.php';
      } else {
        showScreen('main');
      }
    }
  }
});
</script>

</body>
</html>
