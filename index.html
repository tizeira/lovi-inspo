<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym QR">
<title>Gym QR - Auto Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Setup Screen */
#setup-screen {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

#setup-screen h1 {
  font-size: 32px;
  margin-bottom: 10px;
  font-weight: 700;
}

#setup-screen p {
  color: #888;
  margin-bottom: 40px;
  font-size: 15px;
}

.input-group {
  margin-bottom: 20px;
  text-align: left;
}

.input-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #aaa;
  font-weight: 500;
}

.input-group input {
  width: 100%;
  padding: 16px;
  border: 2px solid #333;
  border-radius: 12px;
  background: #1a1a1a;
  color: #fff;
  font-size: 17px;
  transition: border-color 0.2s;
}

.input-group input:focus {
  outline: none;
  border-color: #007aff;
  background: #222;
}

.btn-primary {
  width: 100%;
  padding: 16px;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  transition: background 0.2s;
}

.btn-primary:active {
  background: #0051a8;
}

/* Auto-login Screen */
#autologin-screen {
  display: none;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid #333;
  border-top: 4px solid #007aff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 30px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#autologin-screen h2 {
  font-size: 24px;
  margin-bottom: 10px;
  font-weight: 600;
}

#autologin-screen p {
  color: #888;
  font-size: 15px;
  margin-bottom: 40px;
}

.creds-display {
  background: #1a1a1a;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 30px;
  text-align: left;
}

.cred-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #333;
}

.cred-item:last-child {
  border-bottom: none;
}

.cred-label {
  color: #888;
  font-size: 13px;
  font-weight: 500;
}

.cred-value {
  color: #fff;
  font-size: 15px;
  font-family: 'Courier New', monospace;
}

.btn-secondary {
  width: 100%;
  padding: 14px;
  background: #2a2a2a;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 10px;
  transition: background 0.2s;
}

.btn-secondary:active {
  background: #3a3a3a;
}

/* Hidden form for auto-submit */
#login-form {
  display: none;
}

.hidden {
  display: none !important;
}

/* Status messages */
.status-message {
  margin-top: 20px;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
}

.status-error {
  background: rgba(255, 59, 48, 0.15);
  border: 1px solid rgba(255, 59, 48, 0.3);
  color: #ff3b30;
}

.status-info {
  background: rgba(0, 122, 255, 0.15);
  border: 1px solid rgba(0, 122, 255, 0.3);
  color: #007aff;
}
</style>
</head>
<body>

<!-- Setup Screen -->
<div id="setup-screen">
  <h1>🏋️ Gym QR</h1>
  <p>Configura tu acceso automático al gimnasio</p>

  <div class="input-group">
    <label>Número de Socio</label>
    <input type="number" id="setup-usuario" placeholder="12345678" inputmode="numeric" autocomplete="off">
  </div>

  <div class="input-group">
    <label>Contraseña</label>
    <input type="password" id="setup-clave" placeholder="Tu contraseña" autocomplete="off">
  </div>

  <button class="btn-primary" onclick="saveAndLogin()">Guardar e Iniciar Sesión</button>

  <div id="setup-status"></div>
</div>

<!-- Auto-login Screen -->
<div id="autologin-screen">
  <div class="spinner"></div>
  <h2>Iniciando sesión...</h2>
  <p>Conectando con el club</p>

  <div class="creds-display">
    <div class="cred-item">
      <span class="cred-label">Usuario</span>
      <span class="cred-value" id="display-usuario"></span>
    </div>
    <div class="cred-item">
      <span class="cred-label">Estado</span>
      <span class="cred-value" id="login-status">Autenticando...</span>
    </div>
  </div>

  <button class="btn-secondary" onclick="cancelLogin()">Cancelar</button>
  <button class="btn-secondary" onclick="clearCredentials()">Borrar credenciales</button>

  <div id="autologin-status"></div>
</div>

<!-- Hidden form that auto-submits -->
<form id="login-form" action="https://socios.clubatleticosanmiguel.com/" method="POST" target="_self">
  <input type="number" name="usuario" id="form-usuario">
  <input type="password" name="clave" id="form-clave">
</form>

<script>
let credentials = null;
let loginTimeout = null;

// Check for saved credentials on load
window.onload = function() {
  const saved = localStorage.getItem('gym-credentials');
  if (saved) {
    credentials = JSON.parse(saved);
    autoLogin();
  } else {
    showSetupScreen();
  }
};

function showSetupScreen() {
  document.getElementById('setup-screen').style.display = 'block';
  document.getElementById('autologin-screen').style.display = 'none';
}

function showAutoLoginScreen() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('autologin-screen').style.display = 'block';
  document.getElementById('display-usuario').textContent = credentials.usuario;
}

function saveAndLogin() {
  const usuario = document.getElementById('setup-usuario').value.trim();
  const clave = document.getElementById('setup-clave').value.trim();

  if (!usuario || !clave) {
    showStatus('setup', 'Por favor completa ambos campos', 'error');
    return;
  }

  credentials = { usuario, clave };
  localStorage.setItem('gym-credentials', JSON.stringify(credentials));

  autoLogin();
}

function autoLogin() {
  showAutoLoginScreen();

  // Fill form with credentials
  document.getElementById('form-usuario').value = credentials.usuario;
  document.getElementById('form-clave').value = credentials.clave;

  // Update status
  document.getElementById('login-status').textContent = 'Enviando credenciales...';

  // Auto-submit after 1 second
  loginTimeout = setTimeout(() => {
    document.getElementById('login-status').textContent = 'Redirigiendo...';
    document.getElementById('login-form').submit();
  }, 1000);
}

function cancelLogin() {
  if (loginTimeout) {
    clearTimeout(loginTimeout);
  }
  showSetupScreen();
}

function clearCredentials() {
  if (confirm('¿Estás seguro de que quieres borrar tus credenciales guardadas?')) {
    localStorage.removeItem('gym-credentials');
    credentials = null;
    if (loginTimeout) {
      clearTimeout(loginTimeout);
    }
    location.reload();
  }
}

function showStatus(screen, message, type) {
  const statusId = screen === 'setup' ? 'setup-status' : 'autologin-status';
  const statusEl = document.getElementById(statusId);
  statusEl.className = `status-message status-${type}`;
  statusEl.textContent = message;
  statusEl.style.display = 'block';
}

// Handle iOS Safari back button
window.addEventListener('pageshow', function(event) {
  if (event.persisted || performance.getEntriesByType("navigation")[0].type === 'back_forward') {
    // User came back, check if credentials exist
    const saved = localStorage.getItem('gym-credentials');
    if (saved) {
      credentials = JSON.parse(saved);
      autoLogin();
    }
  }
});
</script>

</body>
</html>
